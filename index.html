<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Link | みんなの4択クイズ</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5fa;color:#17243a;font-family:system-ui,sans-serif}header{background:#142743;color:white;padding:20px max(5%,calc((100% - 1000px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}header b{font-size:24px}small{color:#64748b}main{max-width:1000px;margin:auto;padding:24px 16px}.hero{background:linear-gradient(120deg,#204db5,#5148ac);color:white;border-radius:24px;padding:30px;margin-bottom:20px}.hero h1{font-size:clamp(25px,4vw,38px);margin:8px 0}.hero p{line-height:1.7}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:12px 18px;font-weight:700;background:#e5ebf5;color:#243755}button.primary{background:#3159db;color:white}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #84aaff}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}nav button.active{background:#172b4c;color:white}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:100px;background:white;border-radius:15px;padding:16px}.stat strong{display:block;font-size:25px}.panel,.question{background:white;border:1px solid #e0e6ef;border-radius:18px;padding:24px;margin:16px 0;box-shadow:0 4px 18px #18284d08}.question h2{white-space:pre-wrap;overflow-wrap:anywhere;font-size:22px}.meta{display:flex;justify-content:space-between;gap:10px;color:#64748b;font-size:13px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{text-align:left;display:flex;align-items:center;gap:12px;min-height:65px;background:#f4f7fc;border:2px solid #e1e7f0;white-space:pre-wrap;overflow-wrap:anywhere}.choice span{background:white;border-radius:8px;padding:6px 10px;flex-shrink:0}.choice.correct{background:#dcfce7;border-color:#22a06b;color:#12613f}.choice.wrong{background:#fee2e2;border-color:#dc6666;color:#991b1b}.feedback{background:#f1f5f9;padding:15px;border-radius:10px;margin-top:14px;white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px}.liked{background:#dbeafe;color:#1d4ed8}.field{display:block;margin:14px 0;font-weight:600}.field input,.field textarea,.field select{display:block;width:100%;margin-top:6px;border:1px solid #cbd5e1;border-radius:10px;padding:12px;background:#fff}.field textarea{resize:vertical;min-height:90px}.notice{padding:12px;background:#fff3d5;border-radius:10px;margin:12px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar input,.toolbar select{padding:10px;border:1px solid #cbd5e1;border-radius:10px;max-width:100%}.toolbar input{flex:1} [hidden]{display:none!important}.rank{color:#3159db;font-weight:bold}footer{text-align:center;color:#64748b;padding:25px} @media(max-width:600px){.choices{grid-template-columns:1fr}.panel,.question{padding:17px}header{padding:15px}.hero{padding:20px}}
</style><header><b>Quiz Link<span style="color:#a8baff">.</span></b><button id="share">URLを共有</button></header><main><section class="hero"><small style="color:#dce5ff">CREATE / PLAY / GOOD</small><h1>みんなで作る、4択クイズ。</h1><p>問題を作って、仲間の問題に挑戦しよう。<br>いい問題には GOOD を送ろう！</p><button id="heroCreate">＋ 問題を作る</button></section><div id="status" class="notice" role="status">接続を確認中…</div><div class="stats"><div class="stat"><small>公開問題</small><strong id="total">0</strong></div><div class="stat"><small>あなたの回答</small><strong id="played">0</strong></div><div class="stat"><small>あなたの正解</small><strong id="score">0</strong></div></div><nav><button data-tab="play" class="active">クイズに挑戦</button><button data-tab="create">問題を作る</button><button data-tab="rank">GOODランキング</button><button data-tab="mine">自分の問題</button></nav><section id="create" class="panel" hidden><h2>新しい問題を投稿</h2><form id="form"><label class="field">ニックネーム<input id="author" maxlength="30" placeholder="匿名でもOK"></label><label class="field">ジャンル<select id="category"><option>情報</option><option>数学</option><option>国語</option><option>英語</option><option>理科</option><option>社会</option><option>雑学</option><option>その他</option></select></label><label class="field">問題文<textarea id="prompt" required maxlength="1000" placeholder="問題を入力"></textarea></label><div id="fields"></div><label class="field">正解の選択肢<select id="correct"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></label><label class="field">解説（任意）<textarea id="explanation" maxlength="1000"></textarea></label><button class="primary" id="submit">問題を公開する</button></form></section><section id="browse"><div class="toolbar"><input id="search" placeholder="問題・投稿者を検索"><select id="filter"><option value="">すべてのジャンル</option></select></div><div id="list"></div></section></main><footer>Quiz Link · 個人情報や不適切な内容は投稿しないでください。</footer><script type="module" src="app.js"></script></html>
